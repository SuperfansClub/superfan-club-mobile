name: 🏗️ Build Superfan Club APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Setup Expo and EAS
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    - name: 📲 Install dependencies
      run: |
        echo "📦 Installing dependencies..."
        npm install --legacy-peer-deps
        echo "✅ Dependencies installed successfully"

    - name: 🏗️ Build APK with EAS
      run: |
        echo "🚀 Starting Superfan Club APK build..."
        echo "⏱️  This typically takes 10-15 minutes..."
        
        npx eas build --platform android --profile production --no-wait
        
        if [ $? -eq 0 ]; then
          echo "✅ Build completed successfully!"
        else
          echo "❌ Build failed!"
          exit 1
        fi
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    - name: 📥 Download APK
      run: |
        echo "📥 Getting latest build information..."
        
        BUILD_INFO=$(npx eas build:list --platform android --limit 1 --json)
        BUILD_URL=$(echo "$BUILD_INFO" | jq -r '.[0].artifacts.buildUrl // empty')
        BUILD_STATUS=$(echo "$BUILD_INFO" | jq -r '.[0].status // empty')
        
        echo "📊 Build Status: $BUILD_STATUS"
        
        if [ -n "$BUILD_URL" ] && [ "$BUILD_URL" != "null" ] && [ "$BUILD_URL" != "empty" ]; then
          echo "🔗 Download URL: $BUILD_URL"
          echo "⬇️  Downloading APK..."
          
          curl -L -o superfan-club-v1.0.0.apk "$BUILD_URL"
          
          if [ -f "superfan-club-v1.0.0.apk" ]; then
            echo "✅ APK downloaded successfully!"
            echo "📊 File size: $(du -h superfan-club-v1.0.0.apk | cut -f1)"
            ls -la superfan-club-v1.0.0.apk
          else
            echo "❌ Failed to download APK"
            exit 1
          fi
        else
          echo "❌ Could not get build download URL"
          echo "🔍 Build info: $BUILD_INFO"
          exit 1
        fi

    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: superfan-club-apk-v1.0.0
        path: superfan-club-v1.0.0.apk
        retention-days: 30

    - name: 📊 Build Summary
      run: |
        echo "## 🎉 Superfan Club APK Build Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Your mobile app has been successfully built!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Download Information" >> $GITHUB_STEP_SUMMARY
        echo "- **App Name**: Superfan Club Business" >> $GITHUB_STEP_SUMMARY
        echo "- **File**: superfan-club-v1.0.0.apk" >> $GITHUB_STEP_SUMMARY
        echo "- **Size**: $(du -h superfan-club-v1.0.0.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform**: Android" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download APK" >> $GITHUB_STEP_SUMMARY
        echo "Go to the Artifacts section below to download your APK!" >> $GITHUB_STEP_SUMMARY
